<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1D2021">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Daily Cards">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<title>Training cards</title>
<style>
  .backlink{margin:0 0 14px}
  .backlink a{
    display:inline-block;text-decoration:none;color:#6C716E;font-size:13px;font-weight:600;
    border:1px solid #DADBD5;background:#fff;border-radius:3px;padding:7px 11px;
  }
  .backlink a:hover{color:#1D2021}
</style>
</head>
<body>
<style>
  :root{
    --ink:#1D2021;
    --paper:#EEEFEC;
    --card:#FFFFFF;
    --rule:#DADBD5;
    --work:#BE3226;
    --rest:#54666D;
    --muted:#6C716E;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font:400 16px/1.45 "Helvetica Neue",Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:560px;margin:0 auto;padding:22px 16px 56px}

  header h1{
    font-size:30px;line-height:1.05;font-weight:700;
    letter-spacing:-.02em;margin:2px 0 6px;
  }
  header .goal{font-size:14px;color:var(--muted);margin:0}
  header .meta{font-size:13px;color:var(--muted);margin:10px 0 0;padding-top:10px;border-top:1px solid var(--rule)}

  /* day selector */
  nav{display:flex;gap:6px;margin:18px 0 16px}
  nav button{
    flex:1;padding:9px 0 8px;border:1px solid var(--rule);background:var(--card);
    color:var(--muted);font:600 13px/1 inherit;font-variant-numeric:tabular-nums;
    border-radius:3px;cursor:pointer;
  }
  nav button .d{display:block;font-size:9px;font-weight:400;margin-top:4px;letter-spacing:.02em}
  nav button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
  nav button[data-kind="rest"][aria-pressed="true"]{background:var(--rest);border-color:var(--rest)}
  nav button:focus-visible{outline:2px solid var(--work);outline-offset:2px}

  /* card */
  .card{background:var(--card);border:1px solid var(--rule);border-radius:4px;overflow:hidden}
  .card[hidden]{display:none}
  .top{display:flex;align-items:stretch;border-bottom:1px solid var(--rule)}
  .num{
    flex:0 0 74px;background:var(--work);color:#fff;
    display:flex;flex-direction:column;justify-content:center;align-items:center;
    padding:16px 0;
  }
  .rest .num{background:var(--rest)}
  .num b{font-size:34px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
  .num span{font-size:10px;margin-top:5px;opacity:.85}
  .top-t{padding:14px 16px;align-self:center}
  .top-t h2{margin:0;font-size:19px;font-weight:700;letter-spacing:-.01em}
  .top-t p{margin:3px 0 0;font-size:13px;color:var(--muted)}

  .band{
    padding:11px 16px;background:#F6F6F3;border-bottom:1px solid var(--rule);
    font-size:13.5px;color:#3C4142;
  }
  .band b{font-weight:700;color:var(--ink)}

  ol.ex{list-style:none;margin:0;padding:0}
  ol.ex li{padding:13px 16px;border-bottom:1px solid var(--rule);cursor:pointer}
  ol.ex li:last-child{border-bottom:0}
  .row{display:flex;justify-content:space-between;align-items:baseline;gap:14px}
  .name{font-weight:600;font-size:16px}
  .pres{
    flex:0 0 auto;font-weight:700;font-size:16px;
    font-variant-numeric:tabular-nums;letter-spacing:-.01em;color:var(--work);white-space:nowrap;
  }
  .cue{margin:4px 0 0;font-size:13.5px;color:var(--muted);max-width:44ch}
  li.done .name,li.done .pres{text-decoration:line-through;color:#A8ACA9}
  li.done .cue{color:#B6BAB7}
  li.done .pres{color:#A8ACA9}

  .finish{padding:14px 16px;border-top:2px solid var(--ink);background:#FAFAF8}
  .finish h3{margin:0 0 4px;font-size:13px;font-weight:700}
  .finish p{margin:0;font-size:13.5px;color:#3C4142;max-width:52ch}
  .finish p + p{margin-top:8px}

  .reset{
    margin:14px 0 0;background:none;border:1px solid var(--rule);border-radius:3px;
    padding:8px 12px;font:400 13px inherit;color:var(--muted);cursor:pointer;
  }
  .reset:focus-visible{outline:2px solid var(--work);outline-offset:2px}
  footer{margin-top:26px;padding-top:14px;border-top:1px solid var(--rule);font-size:13px;color:var(--muted)}

  @media print{
    body{background:#fff}
    nav,.reset{display:none}
    .card{display:block !important;page-break-after:always;border:0}
    .wrap{max-width:none}
  }
  @media (prefers-reduced-motion:no-preference){
    ol.ex li{transition:opacity .12s}
  }
</style>

<div class="wrap">
  <p class="backlink"><a href="./">&larr; All cards</a></p>
  
  <header>
    <p class="goal">Firefighter physical test</p>
    <h1>Daily training cards</h1>
    <p class="meta">Weeks 1–3, building foundations. Warm up at least 5 minutes before every session. Tap an exercise to cross it off.</p>
  </header>

  <nav id="nav"></nav>
  <div id="deck"></div>
  <button class="reset" id="reset">Clear today's ticks</button>

  <footer>Run this rotation for three weeks, then feed back at the weekly check-in. Week one is about finding your feet.</footer>
</div>

<script>
const days = [
  {n:1, kind:"work", title:"Strength & conditioning", sub:"Session 1", warm:"<b>Warm up</b> 5 minutes minimum. Keep a good tempo between sets, 90 seconds rest maximum.",
   ex:[
    {name:"Hack or pendulum squat", pres:"3 × 10", cue:"Add weight on each set, aiming for failure on the last one."},
    {name:"Leg or hip press", pres:"15 · 10 · 8 · 6", cue:"Four sets. Start moderate, build as the reps drop."},
    {name:"T-bar row or seated row", pres:"12 · 10 · 8", cue:"If the sets are coming easily, add more weight."},
    {name:"Shoulder press", pres:"12 · 10 · 8 · 6", cue:"Push the final set of 6 to failure."},
    {name:"Farmers carry", pres:"To finish", cue:"Heavy, controlled, upright."}
   ],
   fin:["<b>Stair climbs.</b> Two minutes at level 4–5 to warm up, then two minutes at 5–7, then one minute at level 8. Recover at 4–5 and repeat the block two to three times.","<b>Cool down.</b> Slight incline walk."]},

  {n:2, kind:"work", title:"Cardio & bodyweight strength", sub:"Session 2", warm:"<b>Warm up</b> 5 minutes minimum. Rest periods 90 seconds maximum.",
   ex:[
    {name:"Cross trainer", pres:"20 min", cue:"Minimum level 4 once warm. Go up a level every 2 minutes until the resistance is working against you."},
    {name:"Squats", pres:"3 × 20", cue:"Bodyweight. Keep tension on the legs, don't lock out at the top."},
    {name:"Pull ups", pres:"10 · 8 · 6", cue:"Assisted, taking the assistance down on each set."},
    {name:"Press ups", pres:"3 × max", cue:"Bodyweight. Drop to your knees and carry on to complete failure each set."},
    {name:"Plank", pres:"3 × 20–30 s", cue:"Bodyweight."}
   ],
   fin:["<b>Finish.</b> Full body stretch and mobility.","Push hard on the bodyweight work. This is where core and overall strength come from."]},

  {n:3, kind:"rest", title:"Rest", sub:"Active recovery"},

  {n:4, kind:"work", title:"Circuit training", sub:"Session 3", warm:"<b>Warm up</b> 5–10 minutes moderate on the stair master, cross trainer or incline walk.",
   ex:[
    {name:"Walking lunges", pres:"30 steps", cue:"Total, both legs."},
    {name:"Overhead press", pres:"Heavy", cue:"Weight bag or barbell."},
    {name:"Kettlebell swings", pres:"20 reps", cue:"14 kg or heavier."},
    {name:"Press ups", pres:"15–20", cue:"Bodyweight."},
    {name:"Sled push", pres:"Heavy", cue:"All out."}
   ],
   fin:["<b>Repeat the circuit 3–4 times.</b> All out on every exercise.","<b>Finish.</b> Plank 3 × 20–30 seconds, then an easy incline walk."]},

  {n:5, kind:"rest", title:"Rest", sub:"Active recovery"},
  {n:6, kind:"work", title:"Strength & conditioning", sub:"Session 1 again", repeat:1},
  {n:7, kind:"rest", title:"Rest", sub:"Active recovery"}
];

const restBlock = {
  warm:"Stay moving rather than stopping altogether.",
  ex:[
    {name:"Walk", pres:"Easy", cue:"With the family, or on a lunch break."},
    {name:"Swim or bike ride", pres:"Optional", cue:"Good weekend option."},
    {name:"Sit ups and planks", pres:"If you fancy it", cue:"Core work is fine on rest days."}
  ],
  fin:["Recovery is part of the plan. Eat, sleep, and turn up fresh for the next session."]
};

const state = {active:1, done:new Set()};
const nav = document.getElementById('nav');
const deck = document.getElementById('deck');
const labels = {1:"Mon",2:"Tue",3:"Wed",4:"Thu",5:"Fri",6:"Sat",7:"Sun"};

days.forEach(d => {
  const b = document.createElement('button');
  b.type = 'button';
  b.dataset.kind = d.kind;
  b.innerHTML = d.n + '<span class="d">' + (d.kind === 'rest' ? 'rest' : 'train') + '</span>';
  b.setAttribute('aria-pressed', d.n === 1);
  b.setAttribute('aria-label', 'Day ' + d.n + ', ' + d.title);
  b.onclick = () => { state.active = d.n; render(); };
  nav.appendChild(b);

  const src = d.kind === 'rest' ? restBlock : (d.repeat ? days[0] : d);
  const card = document.createElement('section');
  card.className = 'card' + (d.kind === 'rest' ? ' rest' : '');
  card.dataset.day = d.n;
  card.innerHTML =
    '<div class="top"><div class="num"><b>' + d.n + '</b><span>Day</span></div>' +
    '<div class="top-t"><h2>' + d.title + '</h2><p>' + d.sub + '</p></div></div>' +
    '<div class="band">' + (d.kind === 'rest' ? restBlock.warm : src.warm) + '</div>' +
    '<ol class="ex">' + src.ex.map((e,i) =>
      '<li data-id="' + d.n + '-' + i + '"><div class="row"><span class="name">' + e.name +
      '</span><span class="pres">' + e.pres + '</span></div><p class="cue">' + e.cue + '</p></li>').join('') +
    '</ol>' +
    '<div class="finish"><h3>' + (d.kind === 'rest' ? 'Remember' : 'To finish') + '</h3>' +
    src.fin.map(p => '<p>' + p + '</p>').join('') + '</div>';
  card.addEventListener('click', ev => {
    const li = ev.target.closest('li[data-id]');
    if (!li) return;
    const id = li.dataset.id;
    state.done.has(id) ? state.done.delete(id) : state.done.add(id);
    render();
  });
  deck.appendChild(card);
});

document.getElementById('reset').onclick = () => {
  [...state.done].filter(id => id.startsWith(state.active + '-')).forEach(id => state.done.delete(id));
  render();
};

function render(){
  [...nav.children].forEach((b,i) => b.setAttribute('aria-pressed', days[i].n === state.active));
  [...deck.children].forEach(c => {
    c.hidden = Number(c.dataset.day) !== state.active;
    c.querySelectorAll('li[data-id]').forEach(li =>
      li.classList.toggle('done', state.done.has(li.dataset.id)));
  });
}
render();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  });
}
</script>
</body>
</html>
